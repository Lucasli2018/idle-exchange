<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>账号 · 闲置交换</title>
  <meta name="theme-color" content="#FF7A45">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="back-link" href="/index.html" style="color:#fff;padding:0;">‹ 返回</a>
    <h1 style="font-size:16px;">账号</h1>
    <div style="width:48px;"></div>
  </header>

  <div class="auth-wrap">
    <div class="auth-head">
      <div class="auth-logo">📦</div>
      <h2>闲置交换</h2>
      <p class="auth-tag">登录账号，管理你的发布、收藏与私信</p>
    </div>

    <div class="auth-card">
      <!-- 大号分段标签：登录 / 注册 -->
      <div class="auth-tabs" role="tablist">
        <button class="auth-tab active" id="tabLogin" type="button" role="tab">登录</button>
        <button class="auth-tab" id="tabRegister" type="button" role="tab">注册</button>
        <span class="auth-tab-ind" id="tabInd"></span>
      </div>

      <form id="authForm" novalidate>
        <!-- 登录面板 -->
        <div class="auth-panel" id="panelLogin">
          <div class="field" id="fAccountL">
            <label>账号</label>
            <input type="text" id="loginAccount" maxlength="20" placeholder="你的账号（注册时的昵称）" autocomplete="username" />
            <div class="field-err" id="errAccountL"></div>
          </div>
          <div class="field" id="fPassL">
            <label>密码</label>
            <div class="pw-wrap">
              <input type="password" id="loginPassword" placeholder="请输入密码" autocomplete="current-password" />
              <button type="button" class="pw-toggle" data-target="loginPassword" aria-label="显示密码">👁</button>
            </div>
            <div class="field-err" id="errPassL"></div>
          </div>
          <button type="submit" class="btn btn-primary btn-block" id="loginSubmit">
            <span class="spinner" hidden></span><span class="btn-label">登录</span>
          </button>
        </div>

        <!-- 注册面板 -->
        <div class="auth-panel" id="panelRegister" hidden>
          <div class="field" id="fAccountR">
            <label>账号</label>
            <input type="text" id="regAccount" maxlength="20" placeholder="设置登录账号（2-20 字）" autocomplete="username" />
            <div class="field-err" id="errAccountR"></div>
          </div>
          <div class="field" id="fPassR">
            <label>密码</label>
            <div class="pw-wrap">
              <input type="password" id="regPassword" placeholder="至少 6 位" autocomplete="new-password" />
              <button type="button" class="pw-toggle" data-target="regPassword" aria-label="显示密码">👁</button>
            </div>
            <div class="pw-strength" id="pwStrength"><span></span><span></span><span></span><span></span></div>
            <div class="field-err" id="errPassR"></div>
          </div>
          <div class="field" id="fConfirmR">
            <label>确认密码</label>
            <div class="pw-wrap">
              <input type="password" id="regConfirm" placeholder="再次输入密码" autocomplete="new-password" />
              <button type="button" class="pw-toggle" data-target="regConfirm" aria-label="显示密码">👁</button>
            </div>
            <div class="field-err" id="errConfirmR"></div>
          </div>
          <div class="field" id="fCommunityR">
            <label>所在小区 / 学校 / 公司 <span class="hint">（选填）</span></label>
            <input type="text" id="regCommunity" maxlength="30" placeholder="选填，便于同圈子推荐" />
          </div>
          <button type="submit" class="btn btn-primary btn-block" id="regSubmit">
            <span class="spinner" hidden></span><span class="btn-label">注册并登录</span>
          </button>
        </div>
      </form>

      <!-- 次要入口：邮箱验证码登录 -->
      <div class="auth-foot">
        <div class="auth-divider"><span>其他方式</span></div>
        <button type="button" class="btn-ghost-block" id="emailBtn">📧 使用邮箱验证码登录</button>
        <div id="emailStatus" class="hint" style="margin-top:10px;line-height:1.7;"></div>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
